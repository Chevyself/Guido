# One line arguments to be used on bot launch
arguments:
# Mongo config
mongo:
  uri: mongodb://localhost:27017
  database: guido
# This token is used to authenticate the bot connection
token: 0a123asdsd
# TCP server config
server:
  port: 3366
  timeout: 10000
# The servers created for the
servers: {}
# The configuration used in the listeners of the bot
listeners:
  # Configuration for the Motd
  motd:
    descriptions:
      - Join the googas clan right now
      - Ananin
      - Minecraft
    players:
      - ["Welcome to", "Googas", "LMAO"]
  tips:
    messages:
      - "This is a tip!"